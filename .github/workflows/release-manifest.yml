# .github/workflows/release-manifest.yml
# Publishes a GitHub release on a v* tag push or a manual dispatch: the widget
# manifests (manifest.json, manifest.slim.json), the manifest zip, and a packed
# tarball of @ripple-ui/core, svelte, embed, react and mcp, so the release alone
# is installable. npm publishing runs only on a manual dispatch with
# publish_npm: true. That run enters the npm-publish environment, which only
# lets main deploy and waits for a required reviewer, so no one can publish to
# npm without that approval.
#
# npm auth is trusted publishing (GitHub Actions OIDC), not a stored token. Each
# package has a trusted publisher on npmjs.com naming this repo, this workflow
# file and the npm-publish environment (docs/publishing.md has the setup).
#
# Invariants:
# - Pack runs before publish, and the publish steps upload those exact
#   tarballs, so npm and the release carry the same bytes.
# - package.json in git stays workspace-shaped. scripts/pack-release.mjs
#   rewrites it only while packing (core drops its `source` export conditions,
#   each sibling `file:` dependency becomes `^<that package's version>`), then
#   fails the run if a tarball still carries a file: dependency.
# - Every package's repository.url is git+https://github.com/qbtrix/ripple.git;
#   provenance fails if it does not match this repo exactly.
# - A pre-release version (one with a "-", e.g. 0.9.0-next.0) publishes under
#   its identifier as the npm dist-tag ("next"), never "latest", and its tag
#   (v0.9.0-next.0) makes a GitHub pre-release. Stable versions go to "latest".
# - Packages publish in dependency order: core, svelte, embed, react, mcp. A
#   version already on npm is skipped, so a re-dispatch after a partial publish
#   still reaches the release step.
# - Nothing writes an .npmrc or sets NODE_AUTH_TOKEN, so npm can only
#   authenticate through OIDC. npm is pinned (trusted publishing needs 11.5.1+,
#   dist-tags over OIDC 11.21.0+).
# - Dispatch inputs reach shell scripts as environment variables, never as
#   pasted ${{ }} expressions, so shell syntax in an input stays data.
name: Release manifest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.1). Creates the tag if it does not exist.'
        required: true
        type: string
      publish_npm:
        description: 'Also publish every package to npm (trusted publishing, needs the npm-publish reviewer).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # OIDC token for npm trusted publishing. npm only accepts it from a job in
  # the npm-publish environment (set on each package's trusted publisher).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only an npm-publishing dispatch enters the gated environment; tag pushes
    # and release-only dispatches run without it (an empty name means none).
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_npm) && 'npm-publish' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No registry-url: that writes an .npmrc with a NODE_AUTH_TOKEN slot.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library + manifest
        run: bun run build

      - name: Pack tarballs
        # Publish-shape rewrite, pack and tarball checks all live in the script
        # (see its header); a manual publish runs the same file.
        run: |
          set -euo pipefail
          node scripts/pack-release.mjs release
          ls -la release

      - name: Publish to npm (core, svelte, embed, react, mcp, in that order)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm }}
        run: |
          set -euo pipefail
          npm install -g npm@11.21.2
          npm --version
          for P in core svelte embed react mcp; do
            V=$(node -p "require('./packages/$P/package.json').version")
            if npm view "@ripple-ui/$P@$V" version >/dev/null 2>&1; then
              echo "@ripple-ui/$P@$V is already on npm, skipping"
              continue
            fi
            # A pre-release (0.9.0-next.0) goes out under its identifier ("next"),
            # never "latest", so a plain install keeps getting the last stable.
            case "$V" in
              *-*) DIST_TAG="${V#*-}"; DIST_TAG="${DIST_TAG%%.*}" ;;
              *) DIST_TAG=latest ;;
            esac
            echo "publishing @ripple-ui/$P@$V under dist-tag $DIST_TAG"
            # Keep the ./ prefix: without it npm reads release/x.tgz as a GitHub shorthand.
            npm publish "./release/ripple-ui-$P-$V.tgz" --access public --tag "$DIST_TAG" --provenance
          done

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release/ripple-manifest/schema
          cp packages/svelte/dist/manifest.json release/manifest.json
          cp packages/svelte/dist/manifest.slim.json release/manifest.slim.json
          cp -r packages/svelte/dist release/ripple-manifest/dist
          cp packages/svelte/dist/manifest.json release/ripple-manifest/manifest.json
          find packages/core/src/schema -maxdepth 1 -name '*.ts' ! -name '*.test.ts' -exec cp {} release/ripple-manifest/schema/ \;
          cd release
          zip -r ripple-manifest.zip ripple-manifest
          rm -rf ripple-manifest
          ls -la

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/manifest.json
            release/manifest.slim.json
            release/ripple-manifest.zip
            release/ripple-ui-core-*.tgz
            release/ripple-ui-svelte-*.tgz
            release/ripple-ui-embed-*.tgz
            release/ripple-ui-react-*.tgz
            release/ripple-ui-mcp-*.tgz
