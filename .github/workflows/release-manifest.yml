# .github/workflows/release-manifest.yml
# Publishes a GitHub release on a v* tag push or a manual dispatch: the widget
# manifests (manifest.json, manifest.slim.json), the manifest zip, and a packed
# tarball of @ripple-ui/core, svelte, embed and react, so the release alone is
# installable. npm publishing runs only on a manual dispatch with
# publish_npm: true, and needs the NPM_TOKEN repo secret.
#
# Invariants:
# - Pack runs before publish, and the publish steps upload those exact
#   tarballs, so npm and the release carry the same bytes.
# - package.json in git stays workspace-shaped. scripts/pack-release.mjs
#   rewrites it only while packing (core drops its `source` export conditions,
#   each sibling `file:` dependency becomes `^<that package's version>`), then
#   fails the run if a tarball still carries a file: dependency.
# - Packages publish in dependency order: core, svelte, embed, react. A version already on
#   npm is skipped, so a re-dispatch after a partial publish still reaches the
#   release step.
# - The token lives in $HOME/.npmrc only for the publish command; the trap
#   removes it on any exit, including a cancelled run.
# - Dispatch inputs reach shell scripts as environment variables, never as
#   pasted ${{ }} expressions, so shell syntax in an input stays data.
name: Release manifest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.1). Creates the tag if it does not exist.'
        required: true
        type: string
      publish_npm:
        description: 'Also publish both packages to npm (needs NPM_TOKEN).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library + manifest
        run: bun run build

      - name: Pack tarballs
        # Publish-shape rewrite, pack and tarball checks all live in the script
        # (see its header); a manual publish runs the same file.
        run: |
          set -euo pipefail
          node scripts/pack-release.mjs release
          ls -la release

      - name: Publish to npm (core, svelte, embed, react, in that order)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f "$HOME/.npmrc"' EXIT INT TERM
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          for P in core svelte embed react; do
            V=$(node -p "require('./packages/$P/package.json').version")
            if npm view "@ripple-ui/$P@$V" version >/dev/null 2>&1; then
              echo "@ripple-ui/$P@$V is already on npm, skipping"
              continue
            fi
            bun publish "./release/ripple-ui-$P-$V.tgz" --access public
          done

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release/ripple-manifest/schema
          cp packages/svelte/dist/manifest.json release/manifest.json
          cp packages/svelte/dist/manifest.slim.json release/manifest.slim.json
          cp -r packages/svelte/dist release/ripple-manifest/dist
          cp packages/svelte/dist/manifest.json release/ripple-manifest/manifest.json
          find packages/core/src/schema -maxdepth 1 -name '*.ts' ! -name '*.test.ts' -exec cp {} release/ripple-manifest/schema/ \;
          cd release
          zip -r ripple-manifest.zip ripple-manifest
          rm -rf ripple-manifest
          ls -la

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/manifest.json
            release/manifest.slim.json
            release/ripple-manifest.zip
            release/ripple-ui-core-*.tgz
            release/ripple-ui-svelte-*.tgz
            release/ripple-ui-embed-*.tgz
            release/ripple-ui-react-*.tgz
